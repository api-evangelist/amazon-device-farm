security:
- hmac: []
tags:
- name: '#X Amz Target=DeviceFarm 20150623.GetTestGridSession'
paths:
  /#X-Amz-Target=DeviceFarm_20150623.GetTestGridSession:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: GetTestGridSession
      description: 'A session is an instance of a browser created through a RemoteWebDriver with the URL from CreateTestGridUrlResult$url. You can use the following to look up sessions:


        The session ARN (GetTestGridSessionRequest$sessionArn).


        The project ARN and a session ID (GetTestGridSessionRequest$projectArn and GetTestGridSessionRequest$sessionId).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTestGridSessionResult'
        '480':
          description: NotFoundException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundException'
        '481':
          description: ArgumentException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArgumentException'
        '482':
          description: InternalServiceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalServiceException'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetTestGridSessionRequest'
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - DeviceFarm_20150623.GetTestGridSession
      tags:
      - '#X Amz Target=DeviceFarm 20150623.GetTestGridSession'
      summary: Get test grid session
      x-summary-source: derived
components:
  parameters:
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
  schemas:
    DeviceFarmArn:
      type: string
      pattern: ^arn:aws:devicefarm:.+
      minLength: 32
      maxLength: 1011
    ResourceId:
      type: string
      pattern: .*\S.*
      minLength: 1
      maxLength: 128
    TestGridSessionStatus:
      type: string
      enum:
      - ACTIVE
      - CLOSED
      - ERRORED
    String:
      type: string
    NotFoundException: {}
    InternalServiceException: {}
    Double:
      type: number
      format: double
    ArgumentException: {}
    GetTestGridSessionResult:
      type: object
      properties:
        testGridSession:
          allOf:
          - $ref: '#/components/schemas/TestGridSession'
          - description: The <a>TestGridSession</a> that was requested.
    TestGridSession:
      type: object
      properties:
        arn:
          allOf:
          - $ref: '#/components/schemas/DeviceFarmArn'
          - description: The ARN of the session.
        status:
          allOf:
          - $ref: '#/components/schemas/TestGridSessionStatus'
          - description: The state of the session.
        created:
          allOf:
          - $ref: '#/components/schemas/DateTime'
          - description: The time that the session was started.
        ended:
          allOf:
          - $ref: '#/components/schemas/DateTime'
          - description: The time the session ended.
        billingMinutes:
          allOf:
          - $ref: '#/components/schemas/Double'
          - description: 'The number of billed minutes that were used for this session. '
        seleniumProperties:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: A JSON object of options and parameters passed to the Selenium WebDriver.
      description: A <a>TestGridSession</a> is a single instance of a browser launched from the URL provided by a call to <a>CreateTestGridUrl</a>.
    GetTestGridSessionRequest:
      type: object
      title: GetTestGridSessionRequest
      properties:
        projectArn:
          allOf:
          - $ref: '#/components/schemas/DeviceFarmArn'
          - description: The ARN for the project that this session belongs to. See <a>CreateTestGridProject</a> and <a>ListTestGridProjects</a>.
        sessionId:
          allOf:
          - $ref: '#/components/schemas/ResourceId'
          - description: An ID associated with this session.
        sessionArn:
          allOf:
          - $ref: '#/components/schemas/DeviceFarmArn'
          - description: An ARN that uniquely identifies a <a>TestGridSession</a>.
    DateTime:
      type: string
      format: date-time
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
